<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>월드 타워 워 (World Tower War)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #14141a;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    overflow: hidden;                 /* 스크롤 금지 */
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    position: fixed; inset: 0;        /* 모바일 주소창 스크롤 방지 */
    touch-action: none;
  }
  /* 전체를 세로 스택: [상단 여백/게임] + [하단 버튼바].
     dvh = 동적 뷰포트 높이(모바일 주소창 대응). 폴백으로 vh/100% 사용 */
  #game-wrap {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  /* 게임(캔버스) 영역: 남는 공간을 모두 차지 */
  #stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;                    /* flex 자식 오버플로 방지 */
    overflow: hidden;
  }
  /* 캔버스: stage를 꽉 채우고, 내부는 JS가 비율 맞춰 letterbox */
  #canvas {
    display: block;
    width: 100%; height: 100%;
    background: #ffffff;
    touch-action: none;
  }
  /* 하단 컨트롤 바 (버튼) — 캔버스와 '겹치지 않게' 별도 행 */
  #ui {
    flex: 0 0 auto;
    display: flex;
    gap: clamp(6px, 1.5vw, 12px);
    padding: clamp(6px, 1.5vw, 12px) clamp(8px, 2vw, 16px);
    background: #1b1b22;
    border-top: 1px solid #33333d;
    align-items: stretch;
    justify-content: center;
    flex-wrap: nowrap;                /* 줄바꿈 금지 → 한 줄 유지 */
    overflow-x: auto;                 /* 정 넘치면 가로 스크롤(버튼바 안에서만) */
  }
  .unit-btn {
    position: relative;
    flex: 1 1 0;                      /* 화면폭에 맞춰 균등 신축 */
    min-width: 64px;
    max-width: 110px;
    aspect-ratio: 1 / 1;             /* 정사각 유지 */
    border: 2px solid #4a4a58;
    border-radius: 12px;
    background: #33333d;
    color: #fff;
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    transition: transform .08s, border-color .15s;
    overflow: hidden;
  }
  .unit-btn:hover { border-color: #7a7a90; }
  .unit-btn:active { transform: scale(.95); }
  .unit-btn:disabled { cursor: not-allowed; opacity: .55; }
  .unit-btn .ic { font-size: clamp(20px, 5vw, 30px); line-height: 1; }
  .unit-btn .ic-img {
    width: clamp(30px, 8vw, 46px); height: clamp(30px, 8vw, 46px);
    object-fit: contain;
  }
  .unit-btn .nm { font-size: clamp(10px, 2.2vw, 13px); font-weight: 700; }
  .unit-btn .cost { font-size: clamp(9px, 2vw, 12px); color: #ffd54a; font-weight: 700; }
  /* 쿨타임 오버레이 */
  .unit-btn .cool {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.6);
    height: 0%;
    pointer-events: none;
  }
  /* 상단 HUD (게임 영역 안에 절대배치) */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: clamp(6px,1.5vw,10px) clamp(8px,2vw,14px);
    pointer-events: none; z-index: 5; gap: 8px;
  }
  .money {
    background: rgba(20,20,26,.85);
    color: #ffd54a; font-weight: 800; font-size: clamp(14px,3vw,18px);
    padding: 6px 12px; border-radius: 20px;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .money .bar {
    width: clamp(60px,12vw,120px); height: 8px; background:#444; border-radius: 4px; overflow:hidden;
  }
  .money .bar > span { display:block; height:100%; background:#ffd54a; width:0%; }
  #stage-name {
    background: rgba(20,20,26,.85); color:#fff; font-weight:700;
    font-size: clamp(11px,2.4vw,14px);
    padding: 6px 12px; border-radius: 20px; text-align:right;
    max-width: 55%;
  }
  /* 아주 좁은 화면(세로 모바일)에서는 스테이지명 숨겨 겹침 방지 */
  @media (max-width: 480px){
    #stage-name { display: none; }
  }
  /* ===== 오프닝 화면 (대결 구도) ===== */
  #opening {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column;
    overflow: hidden; cursor: pointer;
    /* 좌 빨강(유튜버) / 우 보라(애니) 대각 분할 */
    background:
      linear-gradient(100deg,
        #2a0d0d 0%, #4a1212 32%,
        #1a1024 50%,
        #2e1147 68%, #1e0a33 100%);
  }
  /* 좌우 진영 발광 */
  #opening::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(70% 90% at 12% 55%, rgba(229,57,53,.45), transparent 60%),
      radial-gradient(70% 90% at 88% 55%, rgba(142,68,215,.5), transparent 60%);
  }
  /* 가운데 번쩍이는 분할선 */
  #opening::after {
    content:''; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(100deg,
      transparent 0 47%,
      rgba(255,255,255,.85) 49% 50%,
      rgba(255,255,255,.15) 50.5% 52%,
      transparent 53% 100%);
    mix-blend-mode: screen;
    animation: clash 2.4s ease-in-out infinite;
  }
  @keyframes clash { 0%,100%{opacity:.35} 50%{opacity:.85} }

  /* 대결 스테이지: 좌 캐릭터 | VS | 우 캐릭터 */
  .op-stage {
    position: relative; z-index: 2;
    flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    gap: clamp(4px, 1.5vw, 24px);
    padding: clamp(10px,2vw,24px) clamp(8px,2vw,20px) 0;
  }
  .op-fighter {
    position: relative;
    display: flex; flex-direction: column;
    flex: 1 1 0; min-width: 0; height: 100%;
    justify-content: flex-end;
  }
  .op-fighter.left  { align-items: flex-start; }   /* 왼쪽 캐릭터는 왼쪽으로 */
  .op-fighter.right { align-items: flex-end; }      /* 오른쪽 캐릭터는 오른쪽으로 */
  .op-char {
    max-height: 68vh; max-width: 92%;
    width: auto; object-fit: contain;
    filter: drop-shadow(0 12px 24px rgba(0,0,0,.6));
    animation: fIn .6s ease both, bob 2.6s ease-in-out infinite 0.6s;
  }
  /* 왼쪽 캐릭터는 오른쪽(가운데)을 향하도록, 오른쪽은 왼쪽을 향하도록 */
  .op-fighter.left  .op-char { transform: scaleX(1); }
  .op-fighter.right .op-char { transform: scaleX(1); }
  .op-fighter.left  { animation: slideL .6s ease both; }
  .op-fighter.right { animation: slideR .6s ease both; }
  @keyframes slideL { from{opacity:0; transform:translateX(-40px)} to{opacity:1;transform:none} }
  @keyframes slideR { from{opacity:0; transform:translateX(40px)}  to{opacity:1;transform:none} }
  @keyframes fIn { from{opacity:0} to{opacity:1} }
  @keyframes bob { 0%,100%{translate:0 0} 50%{translate:0 -12px} }

  .op-badge {
    position: absolute; top: clamp(2px,1vh,10px);
    left: 50%; transform: translateX(-50%);
    font-size: clamp(10px,1.9vw,15px); font-weight: 800; color:#fff;
    padding: 5px 12px; border-radius: 20px; white-space: nowrap;
    box-shadow: 0 4px 12px rgba(0,0,0,.4); z-index: 3;
  }
  .op-badge.yt { background:#e53935; }
  .op-badge.an { background:#8e44d7; }
  .op-side-label {
    position: absolute; bottom: clamp(2px,1vh,8px);
    left: 50%; transform: translateX(-50%);
    font-size: clamp(11px,2vw,16px); font-weight: 800; color:#fff;
    padding: 3px 12px; border-radius: 16px; background: rgba(0,0,0,.5);
    white-space: nowrap;
  }
  .op-side-label.yt { color:#ff8a80; }
  .op-side-label.an { color:#ce93ff; }

  .op-center { flex: 0 0 auto; z-index: 4; }
  .op-vs {
    font-size: clamp(40px, 9vw, 92px); font-weight: 900; font-style: italic;
    color:#ffd54a;
    text-shadow: 0 0 12px rgba(255,213,74,.8), 0 4px 0 #a67c00, 0 6px 20px rgba(0,0,0,.6);
    transform: rotate(-8deg);
    animation: vsPulse 1.4s ease-in-out infinite;
  }
  @keyframes vsPulse { 0%,100%{transform:rotate(-8deg) scale(1)} 50%{transform:rotate(-8deg) scale(1.12)} }

  /* 하단 제목/시작 */
  .op-bottom {
    position: relative; z-index: 3;
    flex: 0 0 auto; text-align: center; color:#fff;
    padding: clamp(6px,1.5vh,16px) 16px clamp(14px,3vh,30px);
  }
  .op-title {
    font-size: clamp(30px, 7vw, 68px); font-weight: 900; line-height: 1.04;
    text-shadow: 0 4px 0 rgba(0,0,0,.4), 0 0 30px rgba(0,0,0,.5);
  }
  .op-title .op-title-sub {
    display:block; font-size: clamp(12px,2.4vw,20px); font-weight:800;
    color:#ffd54a; letter-spacing:.12em; margin-bottom:6px; text-shadow:none;
  }
  .op-title em {
    font-style: normal;
    background: linear-gradient(90deg,#ff5252,#ffd54a,#ce93ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .op-start {
    margin-top: clamp(8px,1.5vh,18px); font-size: clamp(14px,2.6vw,19px); font-weight:700;
    animation: blink 1.2s steps(2,start) infinite;
  }
  @keyframes blink { 50% { opacity:.25; } }
  @media (prefers-reduced-motion: reduce){
    .op-char,.op-fighter,.op-vs,.op-start,#opening::after{animation:none!important}
  }
  /* 세로 화면(모바일/태블릿 portrait): 캐릭터 축소 + 간격 확보로 겹침 방지 */
  @media (max-aspect-ratio: 1/1){
    .op-char { max-height: 42vh; max-width: 96%; }
    .op-stage { gap: clamp(2px,1vw,10px); align-items: center; }
    .op-fighter { justify-content: center; }
    .op-vs { font-size: clamp(30px,8vw,56px); }
  }
  /* 아주 좁은 세로 모바일: 더 축소 */
  @media (max-aspect-ratio: 1/1) and (max-width: 480px){
    .op-char { max-height: 36vh; }
    .op-badge { font-size: 10px; padding: 4px 8px; }
    .op-side-label { font-size: 11px; }
  }

  /* 결과 오버레이 */
  #overlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.7);
    z-index: 20;
  }
  #overlay .card {
    background: #26262e; border: 2px solid #4a4a58; border-radius: 18px;
    padding: 32px 40px; text-align: center; color: #fff;
  }
  #overlay h1 { font-size: 34px; margin-bottom: 8px; }
  #overlay p { color:#bbb; margin-bottom: 20px; }
  #overlay button {
    background:#ffd54a; color:#26262e; border:none; font-weight:800;
    font-size:16px; padding:12px 28px; border-radius:10px; cursor:pointer;
  }
</style>
</head>
<body>
<div id="game-wrap">
  <!-- 게임 영역: 캔버스 + HUD + 오프닝 + 결과 (버튼바와 겹치지 않음) -->
  <div id="stage">
    <canvas id="canvas"></canvas>

    <div id="hud">
      <div class="money">💰 <span id="money-val">0</span>
        <div class="bar"><span id="money-bar"></span></div>
      </div>
      <div id="stage-name">📺 CPU 유튜버 &nbsp;VS&nbsp; 애니 캐릭터 PLAYER 🏯</div>
    </div>

    <!-- ===== 오프닝 화면 ===== -->
    <div id="opening">
      <!-- 진영 대결 스테이지 -->
      <div class="op-stage">
        <!-- 왼쪽: 유튜버 진영 -->
        <div class="op-fighter left">
          <div class="op-badge yt">유튜버 진영 · CPU</div>
          <img class="op-char" src="assets/opening/youtuber.png" alt="유튜버">
          <div class="op-side-label yt">◀ 왼쪽</div>
        </div>

        <!-- 가운데 VS -->
        <div class="op-center">
          <div class="op-vs">VS</div>
        </div>

        <!-- 오른쪽: 애니 진영 -->
        <div class="op-fighter right">
          <div class="op-badge an">애니 진영 · PLAYER(당신)</div>
          <img class="op-char" src="assets/opening/anime.png" alt="애니">
          <div class="op-side-label an">오른쪽 ▶</div>
        </div>
      </div>

      <!-- 제목 + 시작 안내 -->
      <div class="op-bottom">
        <h1 class="op-title">
          <span class="op-title-sub">유튜버 &nbsp;VS&nbsp; 애니메이션</span>
          채운이의 <em>대전쟁</em>
        </h1>
        <div class="op-start">아무 키를 누르거나 화면을 터치하세요</div>
      </div>
    </div>

    <div id="overlay">
      <div class="card">
        <h1 id="overlay-title">승리!</h1>
        <p id="overlay-sub"></p>
        <button onclick="restart()">다시 시작</button>
      </div>
    </div>
  </div>

  <!-- 하단 버튼바 (별도 행) -->
  <div id="ui"><!-- 병사 버튼 JS로 생성 --></div>
</div>

<script>
/* =========================================================================
   월드 타워 워 — 냥코 스타일 프로토타입 (PC용)
   구조 요약
   - GAME_W/H 좌표계로 그리고, 화면 크기에 맞춰 스케일 (반응형 준비 완료)
   - 유닛(병사)은 좌→우(플레이어) / 우→좌(적)로 자동 전진, 만나면 자동 공격
   - 돈이 시간에 따라 차오르고, 버튼으로 병사 생산(쿨타임 있음)
   - 타워 체력 0 되면 승/패
   - drawUnit()에 GIF/스프라이트 끼울 자리 표시해 둠 (지금은 도형)
   ========================================================================= */

const cv = document.getElementById('canvas');
const ctx = cv.getContext('2d');

/* ── 사운드 훅 (assets/sfx/에 파일 넣으면 자동 재생) ──
   나중에 파일을 넣고 이 목록에 등록하면 playSfx('spawn') 형태로 호출 가능.
   파일이 없어도 오류 없이 조용히 무시된다. */
const SFX = {
  // spawn:     'assets/sfx/spawn.mp3',
  // attack:    'assets/sfx/attack.mp3',
  // tower_hit: 'assets/sfx/tower_hit.mp3',
  // win:       'assets/sfx/win.mp3',
  // lose:      'assets/sfx/lose.mp3',
};
const _sfxCache = {};
function playSfx(key){
  const src = SFX[key];
  if (!src) return;                     // 아직 등록 안 됨 → 무시
  try {
    let a = _sfxCache[key];
    if (!a){ a = new Audio(src); _sfxCache[key] = a; }
    a.currentTime = 0; a.play().catch(()=>{});
  } catch(e){}
}

// ── 내부 게임 해상도(좌표계). 실제 화면은 여기에 맞춰 스케일된다. ──
const GAME_W = 1280;
const GAME_H = 720;
const GROUND_Y = 560;          // 병사들이 서는 바닥 y
let scale = 1, offX = 0, offY = 0, dpr = 1;

// ── 반응형: #stage 크기에 맞춰 캔버스 리사이즈 + 스케일 계산 ──
// PC/모바일/태블릿 어디서든 비율 유지 letterbox. 레티나(DPR) 대응으로 선명하게.
function resize() {
  const stage = document.getElementById('stage');
  const w = stage.clientWidth, h = stage.clientHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);   // 과도한 DPR은 2로 제한(성능)
  // 캔버스 내부 픽셀 = CSS크기 × DPR
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  // CSS 표시 크기는 stage에 꽉 차게 (CSS에서 100%/100% 지정됨)
  // GAME_W:GAME_H 비율 유지하며 화면에 맞춤(letterbox)
  scale = Math.min(w / GAME_W, h / GAME_H);
  offX = (w - GAME_W * scale) / 2;
  offY = (h - GAME_H * scale) / 2;
}
// 리사이즈/회전/주소창 변화 모두 대응
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,120));

/* =========================================================================
   유닛(병종) 정의 — 여기 값만 바꾸면 밸런스 조정됨
   ple: 근접 / 원거리 여부, 사거리(range), 데미지, 체력, 속도, 비용, 쿨타임
   gif 필드에 이미지 경로를 넣으면 도형 대신 그 이미지를 쓰도록 되어 있음
   ========================================================================= */
// 프레임 PNG 경로 목록 생성: assets/characters/{char}/{char}_{action}_{i}.png
function frameList(char, action, count){
  const arr=[];
  for(let i=0;i<count;i++)
    arr.push(`assets/characters/${char}/${char}_${action}_${i}.png`);
  return arr;
}

const UNIT_TYPES = {
  // ── 포치타: 근접. 모든 스탯 "보통"의 기준점 ──
  // 원본 그림이 왼쪽을 보고 있어 faceLeft:true → 플레이어(오른쪽 전진)일 때 좌우반전
  pochita: {
    name: '포치타', icon: '🐷', color: '#e74c3c',
    hp: 140, dmg: 20, atkSpeed: 0.55, range: 62, speed: 80,
    cost: 45, cooldown: 2.0, radius: 30,
    gifWalk: 'assets/characters/pochita/pochita_run.gif',
    gifAtk:  'assets/characters/pochita/pochita_attack.gif',
    framesWalk: frameList('pochita','run',6),
    framesAtk:  frameList('pochita','attack',6),
    fpsWalk: 11, fpsAtk: 12,
    faceLeft: true,
    drawScale: 2.6,
  },

  // ── 레제: 원거리. 폭탄을 던져 착탄 지점에 범위 피해 ──
  // 이동=걷기, 공격=던지기. 속도 0.7배(느림), 공격력·체력 포치타와 동일
  reze: {
    name: '레제', icon: '🎀', color: '#34495e',
    hp: 140,            // 포치타 ×1.0
    dmg: 20,            // 포치타 ×1.0
    atkSpeed: 1.1, range: 240, speed: 56,   // speed = 80 ×0.7
    cost: 70, cooldown: 3.6, radius: 28,
    projectile: 'bomb',              // 폭탄 발사체
    splashRadius: 112,               // 캐릭터 크기(radius*2≈56)의 약 2배 = 112
    gifWalk: 'assets/characters/reze/reze_run.gif',
    gifAtk:  'assets/characters/reze/reze_attack.gif',
    framesWalk: frameList('reze','run',6),
    framesAtk:  frameList('reze','attack',6),
    fpsWalk: 10, fpsAtk: 11,
    faceLeft: false,   // 레제 원본은 오른쪽을 보고 있음
    drawScale: 2.7,
  },

  // ── 유기사: 근접. 빠르고 튼튼하지만 공격력 낮음 ──
  // 이동=공격(돌진) 모션, 공격=공격(베기) 모션
  yugisa: {
    name: '유기사', icon: '🪽', color: '#7f8c8d',
    hp: 182,            // 포치타 ×1.3
    dmg: 14,            // 포치타 ×0.7
    atkSpeed: 0.6, range: 64, speed: 104,   // speed = 80 ×1.3
    cost: 60, cooldown: 2.6, radius: 32,
    gifWalk: 'assets/characters/yugisa/yugisa_run.gif',
    gifAtk:  'assets/characters/yugisa/yugisa_attack.gif',
    framesWalk: frameList('yugisa','run',6),
    framesAtk:  frameList('yugisa','attack',6),
    fpsWalk: 12, fpsAtk: 11,
    faceLeft: true,
    drawScale: 2.7,
  },
};

// ── 타워(각 진영 시그니처 건물) 정의 ──
// 플레이어 = 오른쪽(애니메이션 진영), CPU = 왼쪽(유튜버 진영)
const TOWERS = {
  player: { name: '애니 본진', emoji: '🏯', x: GAME_W-90, maxHp: 1500, color:'#e74c3c', label:'PLAYER',
            img:'assets/towers/anime_tower.png' },
  enemy:  { name: '유튜브 스튜디오', emoji: '📺', x: 90,   maxHp: 1500, color:'#2c3e50', label:'CPU',
            img:'assets/towers/youtube_tower.png' },
};

// ── 게임 상태 ──
let state;
function initState() {
  state = {
    money: 150, maxMoney: 999,
    moneyRate: 22,           // 초당 돈 회복
    units: [],               // 전장 위 모든 병사
    projectiles: [],         // 원거리 발사체
    explosions: [],          // 폭발 이펙트(레제 폭탄)
    towerHp: { player: TOWERS.player.maxHp, enemy: TOWERS.enemy.maxHp },
    towerShake: { player: 0, enemy: 0 },        // 피격 흔들림 타이머
    towerPrevHp: { player: TOWERS.player.maxHp, enemy: TOWERS.enemy.maxHp },
    cooldowns: { melee:0, ranged:0, tank:0 },
    enemyTimer: 0,           // 적 AI 스폰 타이머
    over: false, last: performance.now(),
  };
}

/* ── 병사 스폰 ── side: 'player' | 'enemy' ── */
function spawnUnit(typeKey, side) {
  const t = UNIT_TYPES[typeKey];
  const fromX = side === 'player' ? TOWERS.player.x - 40 : TOWERS.enemy.x + 40;
  state.units.push({
    type: typeKey, side,
    x: fromX, y: GROUND_Y,
    hp: t.hp, maxHp: t.hp,
    atkTimer: 0, anim: 0,
    state: 'walk',           // walk | attack
  });
}

/* ── 플레이어 병사 생산(버튼) ── */
function tryProduce(typeKey) {
  if (state.over) return;
  const t = UNIT_TYPES[typeKey];
  if (state.money < t.cost) return;
  if (state.cooldowns[typeKey] > 0) return;
  state.money -= t.cost;
  state.cooldowns[typeKey] = t.cooldown;
  spawnUnit(typeKey, 'player');
}

/* =========================================================================
   업데이트 (물리/전투 로직)
   ========================================================================= */
function update(dt) {
  if (!started) return;   // 오프닝 화면 동안은 정지
  if (state.over) return;

  // 돈 회복
  state.money = Math.min(state.maxMoney, state.money + state.moneyRate * dt);

  // 쿨타임 감소
  for (const k in state.cooldowns)
    state.cooldowns[k] = Math.max(0, state.cooldowns[k] - dt);

  // 적 AI: 주기적으로 랜덤 병사 스폰 (난이도 = 스폰 간격)
  state.enemyTimer -= dt;
  if (state.enemyTimer <= 0) {
    const pool = ['pochita','pochita','reze','yugisa'];
    spawnUnit(pool[Math.floor(Math.random()*pool.length)], 'enemy');
    state.enemyTimer = 2.4 + Math.random()*1.6;
  }

  // 각 유닛 처리
  for (const u of state.units) {
    if (u.hp <= 0) continue;
    const t = UNIT_TYPES[u.type];
    const dir = u.side === 'player' ? -1 : 1;

    // 사거리 내 가장 가까운 적 탐색
    const target = findTarget(u, t);

    u.anim += dt;  // 애니메이션은 걷기/공격 모두에서 진행

    if (target) {
      u.state = 'attack';
      u.atkTimer -= dt;
      if (u.atkTimer <= 0) {
        u.atkTimer = t.atkSpeed;
        if (t.range > 120) {
          // 원거리: 발사체 생성
          const isBomb = t.projectile === 'bomb';
          const startX = u.x, startY = u.y - 34;
          const tgtX = targetX(target.ref);
          state.projectiles.push({
            x: startX, y: startY,
            x0: startX, y0: startY,          // 시작점(포물선 계산용)
            tx: target.ref, side: u.side, dmg: t.dmg,
            speed: isBomb ? 420 : 520,
            kind: isBomb ? 'bomb' : 'arrow',
            splash: isBomb ? (t.splashRadius||0) : 0,
            spin: 0,
          });
        } else {
          // 근접: 즉시 데미지
          dealDamage(target.ref, t.dmg);
        }
      }
    } else {
      // 목표 없음 → 전진
      u.state = 'walk';
      u.x += dir * t.speed * dt;
    }
  }

  // 발사체 이동/명중
  for (const p of state.projectiles) {
    if (p.dead) continue;
    const tgtX = targetX(p.tx);
    const tgtY = targetY(p.tx) - 20;
    const dx = tgtX - p.x, dy = tgtY - p.y;
    const dist = Math.hypot(dx, dy);
    const step = p.speed * dt;
    p.spin += dt * 12;
    if (dist <= step || isDead(p.tx)) {
      // 착탄 지점
      const hitX = (dist<=step)? tgtX : p.x;
      const hitY = GROUND_Y;
      if (p.splash > 0) {
        // ── 범위 공격: 착탄점 주변 적 유닛 모두 피해 ──
        for (const e of state.units) {
          if (e.side === p.side || e.hp <= 0) continue;
          if (Math.abs(e.x - hitX) <= p.splash) dealDamage(e, p.dmg);
        }
        // 적 타워도 범위 안이면 피해
        const enemySide = p.side==='player' ? 'enemy' : 'player';
        if (Math.abs(TOWERS[enemySide].x - hitX) <= p.splash)
          dealDamage('tower:'+enemySide, p.dmg);
        // 폭발 이펙트
        state.explosions.push({ x: hitX, y: hitY-20, r: 0, max: p.splash, t: 0 });
      } else {
        if (!isDead(p.tx)) dealDamage(p.tx, p.dmg);
      }
      p.dead = true;
    } else {
      p.x += dx/dist*step; p.y += dy/dist*step;
      // 폭탄은 포물선(살짝 떠서 감)
      if (p.kind==='bomb'){
        const total = Math.hypot(tgtX-p.x0, tgtY-p.y0) || 1;
        const prog = 1 - dist/total;                 // 0→1 진행도
        p.arc = Math.sin(prog*Math.PI) * 60;         // 최대 60px 상승
      }
    }
  }

  // 폭발 이펙트 진행
  for (const ex of state.explosions){ ex.t += dt; ex.r = ex.max * Math.min(1, ex.t/0.25); }
  state.explosions = state.explosions.filter(ex => ex.t < 0.4);

  // 타워 피격 감지 → 흔들림 트리거, 흔들림 타이머 감소
  for (const s of ['player','enemy']){
    if (state.towerHp[s] < state.towerPrevHp[s]) state.towerShake[s] = 0.32;  // 맞으면 흔들
    state.towerPrevHp[s] = state.towerHp[s];
    if (state.towerShake[s] > 0) state.towerShake[s] = Math.max(0, state.towerShake[s]-dt);
  }

  // 죽은 것 정리
  state.units = state.units.filter(u => u.hp > 0);
  state.projectiles = state.projectiles.filter(p => !p.dead);

  // 승패 판정
  if (state.towerHp.enemy <= 0)  endGame(true);
  if (state.towerHp.player <= 0) endGame(false);
}

/* 사거리 내 타겟 찾기 (적 유닛 또는 적 타워). ref는 유닛객체 또는 'tower:side' */
function findTarget(u, t) {
  const dir = u.side === 'player' ? -1 : 1;
  const enemySide = u.side === 'player' ? 'enemy' : 'player';
  let best = null, bestDist = Infinity;

  // 적 유닛
  for (const e of state.units) {
    if (e.side === u.side || e.hp <= 0) continue;
    const gap = (e.x - u.x) * dir;          // 앞쪽에 있는가
    const absd = Math.abs(e.x - u.x);
    if (gap >= -10 && absd <= t.range && absd < bestDist) {
      best = { ref: e }; bestDist = absd;
    }
  }
  // 적 타워
  const towerX = TOWERS[enemySide].x;
  const gapT = (towerX - u.x) * dir;
  const absT = Math.abs(towerX - u.x);
  if (gapT >= -10 && absT <= t.range && absT < bestDist) {
    best = { ref: 'tower:'+enemySide };
  }
  return best;
}

// ref 헬퍼들 (유닛 객체 또는 'tower:side' 문자열 모두 처리)
function targetX(ref){ return typeof ref==='string' ? TOWERS[ref.split(':')[1]].x : ref.x; }
function targetY(ref){ return typeof ref==='string' ? GROUND_Y : ref.y; }
function isDead(ref){ return typeof ref==='string' ? state.towerHp[ref.split(':')[1]]<=0 : ref.hp<=0; }
function dealDamage(ref, dmg){
  if (typeof ref === 'string') {
    const side = ref.split(':')[1];
    state.towerHp[side] = Math.max(0, state.towerHp[side] - dmg);
  } else {
    ref.hp -= dmg;
  }
}

/* =========================================================================
   렌더링
   ========================================================================= */
function draw() {
  // 전체 캔버스를 여백 색으로 클리어 (letterbox 바깥 영역)
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#14141a';
  ctx.fillRect(0,0,cv.width,cv.height);

  // 게임 좌표계로 변환 (DPR 포함): 화면px = (게임좌표 × scale + off) × dpr
  ctx.setTransform(scale*dpr, 0, 0, scale*dpr, offX*dpr, offY*dpr);

  // 배경 이미지 (왼쪽 붉은 황무지=유튜버 / 오른쪽 푸른 초원=애니)
  const groundY = GROUND_Y+40;
  const bgImg = getImg('assets/bg/battlefield.png');
  if (bgImg && bgImg.complete && bgImg.naturalWidth) {
    ctx.drawImage(bgImg, 0, 0, GAME_W, GAME_H);
    // 캐릭터/타워 가독성 보강: 하단(지면)에 아주 옅은 밝기 오버레이
    const veil = ctx.createLinearGradient(0, groundY-60, 0, GAME_H);
    veil.addColorStop(0, 'rgba(255,255,255,0)');
    veil.addColorStop(1, 'rgba(255,255,255,0.12)');
    ctx.fillStyle = veil;
    ctx.fillRect(0, groundY-60, GAME_W, GAME_H-(groundY-60));
  } else {
    // ── 폴백: 로드 전 진영 그라데이션 ──
    const bg = ctx.createLinearGradient(0,0,GAME_W,0);
    bg.addColorStop(0.00,'#fdeaea'); bg.addColorStop(0.50,'#f7f4fb'); bg.addColorStop(1.00,'#efe6fb');
    ctx.fillStyle = bg; ctx.fillRect(0,0,GAME_W,GAME_H);
    const gg = ctx.createLinearGradient(0,0,GAME_W,0);
    gg.addColorStop(0,'#f3d9d9'); gg.addColorStop(0.5,'#ede8f0'); gg.addColorStop(1,'#e2d3f2');
    ctx.fillStyle = gg; ctx.fillRect(0, groundY, GAME_W, GAME_H-groundY);
  }

  // 타워 그리기
  drawTower('player');
  drawTower('enemy');

  // 유닛 (뒤에 있는 것부터)
  const sorted = [...state.units].sort((a,b)=>a.y-b.y);
  for (const u of sorted) drawUnit(u);

  // 발사체
  for (const p of state.projectiles) {
    const py = p.y - (p.arc||0);   // 포물선 상승 반영
    if (p.kind === 'bomb') {
      // 폭탄: 검은 원 + 심지 + 반짝임
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(p.x, py, 11, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#8a6d3b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.x+7, py-8);
      ctx.quadraticCurveTo(p.x+14, py-16, p.x+10, py-20); ctx.stroke();
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath(); ctx.arc(p.x+10, py-21, 2.5, 0, Math.PI*2); ctx.fill();
      // 하이라이트
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.beginPath(); ctx.arc(p.x-3, py-3, 3, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = p.side==='player' ? '#8e44ad' : '#c0392b';
      ctx.beginPath(); ctx.arc(p.x, py, 6, 0, Math.PI*2); ctx.fill();
    }
  }

  // 폭발 이펙트 (레제 범위 공격)
  for (const ex of state.explosions){
    const a = 1 - ex.t/0.4;                 // 점점 투명
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    // 바깥 링
    ctx.strokeStyle = '#ff7043'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI*2); ctx.stroke();
    // 안쪽 채움
    ctx.fillStyle = 'rgba(255,160,0,.30)';
    ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r*0.75, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawTower(side) {
  const T = TOWERS[side];
  const hp = state.towerHp[side], ratio = hp / T.maxHp;
  const tsec = performance.now()/1000;

  // ── 움직임 계산 ──
  // 1) 호흡하듯 상하 부유 (진영마다 위상 다르게)
  const phase = side==='player' ? 0.9 : 0;
  const floatY = Math.sin(tsec*1.6 + phase) * 5;         // ±5px 상하
  // 2) 아주 미세한 좌우 흔들림
  const swayX = Math.sin(tsec*1.1 + phase) * 2;          // ±2px
  // 3) 피격 흔들림 (맞으면 부르르)
  const sh = state.towerShake[side] || 0;
  const shakeX = sh>0 ? Math.sin(tsec*60) * sh * 22 : 0;
  const shakeY = sh>0 ? Math.cos(tsec*55) * sh * 10 : 0;

  // 타워 바닥이 지면(GROUND_Y+40)에 닿도록 이미지 배치
  const baseY = GROUND_Y + 40;
  const img = getImg(T.img);
  let topY;   // 타워 상단 y (이름/체력바 배치용)

  if (img && img.complete && img.naturalWidth) {
    // 이미지 크기: 높이를 약 440px로 맞추고 비율 유지
    const H = 470;
    const W = H * (img.naturalWidth / img.naturalHeight);
    const drawX = T.x - W/2 + swayX + shakeX;
    const drawY = baseY - H + floatY + shakeY;
    topY = drawY;
    // 부드러운 그림자
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.14)';
    ctx.beginPath();
    ctx.ellipse(T.x, baseY-6, W*0.34, 14, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    ctx.drawImage(img, drawX, drawY, W, H);
  } else {
    // ── 폴백: 이모지 ──
    ctx.font = '300px serif';
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText(T.emoji, T.x + swayX + shakeX, baseY + floatY + shakeY);
    topY = baseY - 440;
  }

  ctx.textAlign = 'center';

  // 이름 (배경 위에서도 잘 보이게 외곽선 처리)
  ctx.font = 'bold 22px sans-serif';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.lineWidth = 5;
  ctx.strokeText(T.name, T.x, topY - 30);
  ctx.fillStyle = '#fff';
  ctx.fillText(T.name, T.x, topY - 30);

  // 진영 라벨 배지
  const isPlayer = side === 'player';
  const badge = T.label;
  ctx.font = 'bold 16px sans-serif';
  const padX = 12, bwd = ctx.measureText(badge).width + padX*2;
  const bxd = T.x - bwd/2, byd = topY - 78, bhd = 26;
  ctx.fillStyle = isPlayer ? '#2e7d32' : '#c62828';
  roundRect(bxd, byd, bwd, bhd, 13); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
  ctx.fillText(badge, T.x, byd + bhd/2 + 1);
  ctx.textBaseline = 'alphabetic';

  // 체력바
  const bw = 160, bh = 14, bx = T.x - bw/2, by = topY - 22;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(bx-2,by-2,bw+4,bh+4);  // 어두운 테두리 배경
  ctx.fillStyle = '#ddd'; ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle = ratio>.3 ? '#2ecc71' : '#e74c3c';
  ctx.fillRect(bx,by,bw*ratio,bh);
  ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.lineWidth=1.5; ctx.strokeRect(bx,by,bw,bh);
}

/* ── 병사 하나 그리기 ──
   ★ GIF/스프라이트를 쓰려면 이 함수에서 u.state('walk'|'attack')에 따라
     UNIT_TYPES[u.type].gifWalk / gifAtk 이미지를 drawImage로 그리면 됨.
     현재는 도형(원 + 방향 표시)으로 렌더링. ── */
const imgCache = {};
function getImg(src){
  if(!src) return null;
  if(!imgCache[src]){ const i=new Image(); i.src=src; imgCache[src]=i; }
  return imgCache[src];
}
// 모든 캐릭터 프레임 + 타워 이미지 미리 로딩
function preloadUnitFrames(){
  for (const key in UNIT_TYPES){
    const t = UNIT_TYPES[key];
    [...(t.framesWalk||[]), ...(t.framesAtk||[])].forEach(getImg);
  }
  for (const s in TOWERS){ if (TOWERS[s].img) getImg(TOWERS[s].img); }
  getImg('assets/bg/battlefield.png');   // 전장 배경
}
// frames 배열에서 "지금 준비된" 이미지를 고른다.
// 원하는 프레임이 아직 안 왔으면, 이미 로드된 다른 프레임으로 대체 → 도형/빈칸 안 뜸
function pickReadyFrame(frames, idx){
  const want = getImg(frames[idx]);
  if (want && want.complete && want.naturalWidth) return want;
  for (let i=0;i<frames.length;i++){
    const im = getImg(frames[i]);
    if (im && im.complete && im.naturalWidth) return im;   // 아무거나 준비된 것
  }
  return null;  // 정말 하나도 없음
}

function drawUnit(u) {
  const t = UNIT_TYPES[u.type];
  const dir = u.side==='player' ? -1 : 1;
  const hasFrames = !!(t.framesWalk && t.framesWalk.length);

  // 프레임 시퀀스(PNG)가 있으면 그걸 애니메이션, 없으면 도형
  const frames = u.state==='attack'
    ? (t.framesAtk || t.framesWalk)
    : t.framesWalk;
  const fps = u.state==='attack' ? (t.fpsAtk||10) : (t.fpsWalk||10);
  let img = null;
  if (frames && frames.length){
    const idx = Math.floor(u.anim * fps) % frames.length;
    img = pickReadyFrame(frames, idx);
  }
  const size = t.radius * (t.drawScale || 2.6);
  if (img) {
    // 바라볼 방향: 플레이어 +1(오른쪽), 적 -1(왼쪽).
    // 그림 기본 방향(faceLeft?-1:+1)과 다르면 좌우 반전
    const baseDir = t.faceLeft ? -1 : 1;
    const flip = (dir !== baseDir) ? -1 : 1;
    ctx.save();
    ctx.translate(u.x, u.y);
    ctx.scale(flip, 1);
    ctx.drawImage(img, -size/2, -size, size, size);
    ctx.restore();
  } else if (!hasFrames) {
    // ── 도형 폴백 (프레임 이미지가 아예 없는 병종만) ──
    ctx.save();
    ctx.translate(u.x, u.y - t.radius);
    // 그림자
    ctx.fillStyle='rgba(0,0,0,.12)';
    ctx.beginPath(); ctx.ellipse(0,t.radius+2,t.radius*.9,6,0,0,Math.PI*2); ctx.fill();
    // 몸통
    ctx.fillStyle = u.side==='player' ? t.color : shade(t.color,-30);
    ctx.beginPath(); ctx.arc(0,0,t.radius,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=2; ctx.stroke();
    // 아이콘
    ctx.font = `${t.radius+4}px serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(t.icon, 0, 1);
    // 진행 방향 표시
    ctx.fillStyle = u.side==='player'?'#2c3e50':'#c0392b';
    ctx.beginPath();
    ctx.moveTo(dir*(t.radius+4), 0);
    ctx.lineTo(dir*(t.radius-4), -6);
    ctx.lineTo(dir*(t.radius-4), 6);
    ctx.fill();
    ctx.restore();
  }
  // hasFrames인데 아직 이미지 하나도 준비 안 된 극초기 순간엔
  // 아무것도 안 그림(다음 프레임에 바로 뜸) → 원 깜빡임 없음

  // 체력바
  const bw=t.radius*2, bh=5, bx=u.x-bw/2, by=u.y - t.radius*2 - 14;
  const r = u.hp/u.maxHp;
  ctx.fillStyle='rgba(0,0,0,.15)'; ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle = u.side==='player' ? '#3498db' : '#e74c3c';
  ctx.fillRect(bx,by,bw*r,bh);
}

// 둥근 사각형 경로 (배지/버튼용)
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// 색상 밝기 조절 유틸
function shade(hex, amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

/* =========================================================================
   메인 루프 + UI 동기화
   ========================================================================= */
function loop(now) {
  const dt = Math.min(0.05, (now - state.last)/1000);
  state.last = now;
  update(dt);
  draw();
  syncUI();
  requestAnimationFrame(loop);
}

function syncUI() {
  document.getElementById('money-val').textContent = Math.floor(state.money);
  document.getElementById('money-bar').style.width =
    (state.money/state.maxMoney*100)+'%';
  // 버튼 쿨/비용 상태
  for (const key in UNIT_TYPES) {
    const btn = document.getElementById('btn-'+key);
    if (!btn) continue;
    const t = UNIT_TYPES[key];
    const cd = state.cooldowns[key];
    btn.disabled = state.money < t.cost || cd > 0;
    const cool = btn.querySelector('.cool');
    cool.style.height = cd>0 ? (cd/t.cooldown*100)+'%' : '0%';
  }
}

/* ── 버튼 UI 생성 ── */
function buildButtons() {
  const ui = document.getElementById('ui');
  ui.innerHTML = '';
  for (const key in UNIT_TYPES) {
    const t = UNIT_TYPES[key];
    const b = document.createElement('button');
    b.className = 'unit-btn'; b.id = 'btn-'+key;
    // 프레임 이미지가 있으면 첫 프레임을 썸네일로, 없으면 이모지 아이콘
    const thumb = (t.framesWalk && t.framesWalk[0])
      ? `<img class="ic-img" src="${t.framesWalk[0]}" alt="${t.name}">`
      : `<div class="ic">${t.icon}</div>`;
    b.innerHTML =
      `${thumb}
       <div class="nm">${t.name}</div>
       <div class="cost">💰${t.cost}</div>
       <div class="cool"></div>`;
    b.addEventListener('click', ()=>tryProduce(key));
    ui.appendChild(b);
  }
}

function endGame(win){
  state.over = true;
  document.getElementById('overlay-title').textContent = win ? '승리! 🎉' : '패배…';
  document.getElementById('overlay-title').style.color = win ? '#2ecc71':'#e74c3c';
  document.getElementById('overlay-sub').textContent =
    win ? '유튜브 스튜디오를 함락했습니다!' : '애니 본진이 파괴되었습니다.';
  document.getElementById('overlay').style.display='flex';
}
function restart(){
  document.getElementById('overlay').style.display='none';
  initState();
}

// ── 오프닝 → 게임 시작 ──
let started = false;
function startGame(){
  if (started) return;
  started = true;
  const op = document.getElementById('opening');
  op.style.transition = 'opacity .35s';
  op.style.opacity = '0';
  setTimeout(()=>{ op.style.display='none'; }, 360);
  initState();                      // 상태 초기화(오프닝 동안 안 흐르게)
  state.last = performance.now();
  // playSfx('start');  // 사운드 넣으면 사용
}
// 아무 키 / 클릭 / 터치로 시작
window.addEventListener('keydown', startGame);
window.addEventListener('mousedown', (e)=>{ if(!started) startGame(); });
window.addEventListener('touchstart', (e)=>{ if(!started){ startGame(); } }, {passive:true});

// ── 시작 ──
resize();
preloadUnitFrames();   // 캐릭터 프레임 미리 로딩 (원 깜빡임 방지)
buildButtons();
initState();
state.last = performance.now();
requestAnimationFrame(loop);
// 폰트/레이아웃 확정 후 한 번 더 크기 보정 (초기 0px 방지)
window.addEventListener('load', ()=>setTimeout(resize, 50));
setTimeout(resize, 0);
</script>
